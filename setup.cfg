[metadata]
description_file = README.md

# -- Tests -------------------------------------------
[tool:pytest]
testpaths = tests
# importlib mode keeps pytest from importing the repo-root package (a QGIS
# plugin whose __init__ pulls in QGIS-only deps) while collecting tests.
addopts = --import-mode=importlib
markers =
    slow: needs TensorFlow/model inference or the tiled pipeline (deselect with -m "not slow")

# -- Code quality ------------------------------------
[flake8]
count = True
exclude =
    .git
ignore = T201, W503, W504
max-complexity = 20
max-doc-length = 130
max-line-length = 80
per-file-ignores =
    __init__.py: E501, W505, I001, I005
    plugin_upload.py: E501, W505, F821
    resources.py: E501, W505
    winmol_analyzer.py: F401, E501, F403, W505
    winmol_analyzer_dialog.py: E501, W505, E402
    WINMOL_Analyzer.py: E402
    get_pip.py: E501
per-file-line_length = 21

[isort]
ensure_newline_before_comments = True
force_grid_wrap = 0
include_trailing_comma = True
line_length = 80
multi_line_output = 3
profile = black
use_parentheses = True
