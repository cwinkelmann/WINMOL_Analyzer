name: Create and release archive
on:
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Same builder the "Build plugin ZIP" job runs on every PR, and the
      # one tests/test_plugin_package.py asserts against. Releases used to
      # do their own inline `zip -r` with a different exclude list, so what
      # users installed was never the artifact CI validated.
      # The version argument rewrites metadata.txt inside the archive.
      - name: Build the plugin ZIP
        run: >
          bash scripts/build_plugin_zip.sh HEAD
          WINMOL_Analyzer_QGIS_Plugin.zip "${GITHUB_REF_NAME#v}"

      - name: Upload Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "WINMOL_Analyzer_QGIS_Plugin.zip"
          allowUpdates: true
          # Every pre-1.0 tag so far is a candidate build (-rcN / -reimplN).
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
