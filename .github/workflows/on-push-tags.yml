name: Create and release archive
on:
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: WINMOL_Analyzer

      - name: Build the plugin package
        # Uses `git archive`, so the file set comes from .gitattributes
        # (export-ignore) — the SAME single list `make package` uses. The
        # previous hand-maintained -x list had drifted: it still shipped
        # tests/fixtures, docs/ and 11 MB of standalone/*.ipynb notebooks.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build
          git -C WINMOL_Analyzer archive --prefix=WINMOL_Analyzer/ HEAD \
            | tar -x -C build
          META=build/WINMOL_Analyzer/metadata.txt
          if grep -q '^version=' "$META"; then
            sed -i "s/^version=.*/version=$VERSION/" "$META"
          else
            echo "version=$VERSION" >> "$META"
          fi
          (cd build && zip -9r ../WINMOL_Analyzer_QGIS_Plugin.zip WINMOL_Analyzer)
          echo "Packaged $(du -h WINMOL_Analyzer_QGIS_Plugin.zip | cut -f1)"
      - name: Upload Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "WINMOL_Analyzer_QGIS_Plugin.zip"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
