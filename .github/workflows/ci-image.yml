name: CI test image

# Builds the test container (pinned env + Zenodo model, see
# docker/ci/Dockerfile) and pushes it to ghcr.io. The tests workflow runs
# inside this image. Rebuilds only when the image inputs change, or on
# manual dispatch (use that once to bootstrap before the first tests run).

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/ci/**"
      - "requirements/base.txt"
      - "requirements/ci.txt"
      - "requirements/convert.txt"
      - "scripts/convert_models_to_onnx.py"
      - ".github/workflows/ci-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/winmol-analyzer-ci:latest
            ghcr.io/${{ github.repository_owner }}/winmol-analyzer-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
